openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: weather
    description: Weather operations
  - name: quotes
    description: Quote operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /weather:
    get:
      operationId: getWeather
      tags: [weather]
      summary: Current weather
      description: Returns current weather conditions
      responses:
        "200":
          description: Current weather data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeatherStatus"
  /quote:
    get:
      operationId: getQuote
      tags: [quotes]
      summary: Random quote
      description: Returns a random inspirational quote
      responses:
        "200":
          description: A quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    WeatherStatus:
      type: object
      properties:
        temp_c:
          type: number
        feels_c:
          type: number
        humidity:
          type: number
        wind_kmh:
          type: number
        uv:
          type: number
        weather_code:
          type: number
        condition:
          type: string
      required:
        - temp_c
        - feels_c
        - humidity
        - wind_kmh
        - uv
        - weather_code
        - condition
    QuoteResponse:
      type: object
      properties:
        text:
          type: string
        author:
          type: string
      required:
        - text
        - author
